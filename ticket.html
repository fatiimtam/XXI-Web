<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinema XXI ‧ Book Seats</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="ticket.css" />
  </head>

  <body>
   
    <div class="topnav" style="justify-content: space-between">
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Cinema_XXI.svg/1196px-Cinema_XXI.svg.png"
        alt="XXI logo"
        onclick="window.location.href='index.html'"
        style="margin-left: 12px; height: 24px"
      />
      <div
        style="display: flex; align-items: center; gap: 18px; margin-right: 12px"
      >
        <a onclick="window.location.href='index.html'">Home</a>
        <a href="#login">Login</a>
        <a class="active" href="#signup">Sign Up</a>
      </div>
    </div>

    <!-- Form -->
    <div class="container">
      <form id="ticketForm">
        <h2>Book Your Ticket</h2>

        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Name here !" />
        <small class="error" id="nameError"></small>

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Email here !" />
        <small class="error" id="emailError"></small>

        <label for="film">Movie:</label>
        <div class="select-wrapper">
          <select id="film">
            <option value="">Choose Movie</option>
            <option value="Spider-Man" data-price="55000">
              Spider-Man: Across the Spider-Verse (Rp55.000)
            </option>
            <option value="Fnaf" data-price="50000">
              Five Nights at Freddy’s (Rp50.000)
            </option>
            <option value="ChainsawmanReze" data-price="60000">
              Chainsaw Man: Reze Arc (Rp60.000)
            </option>
          </select>
        </div>
        <small class="error" id="filmError"></small>

        <label for="tickets">Tickets:</label>
        <input type="number" id="tickets" min="1" max="10" value="1" />
        <small class="error" id="ticketsError"></small>

        <p id="previewPrice" class="preview">Total Price: Rp 0</p>

        <button type="button" onclick="validateForm()">Book</button>
      </form>
    </div>

    <script src="ticket.js"></script>
  </body>
</html>
